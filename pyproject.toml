[project]
name = "hr-agent-local"
version = "0.1.0"
description = "HR policy Q&A + WorkWeek HCM + ServiceImmediately ITSM multi-agent sample (Google ADK, local)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=2.2.0,<3.0.0",
    "google-cloud-discoveryengine>=0.13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
